<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f2">
  <title>Libreta del Fiado</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f2;
      --surface: #fff;
      --surface-soft: #f7f8f5;
      --text: #1e2922;
      --muted: #6d786f;
      --border: #e3e8e1;
      --accent: #24734b;
      --accent-hover: #1b5e3c;
      --accent-soft: #e9f4ec;
      --danger: #b83d3d;
      --danger-soft: #fff0ee;
      --debt: #a52f2f;
      --debt-soft: #fff0ee;
      --clear: #1b6b42;
      --clear-soft: #e9f4ec;
      --whatsapp: #176b3a;
      --whatsapp-hover: #10552d;
      --whatsapp-soft: #e9f4ec;
      --shadow: 0 8px 26px rgb(28 49 35 / 6%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141a16;
        --surface: #1d2520;
        --surface-soft: #222c25;
        --text: #edf3ee;
        --muted: #a4b0a7;
        --border: #344139;
        --accent: #72c58f;
        --accent-hover: #8bd5a5;
        --accent-soft: #253b2d;
        --danger: #ff8980;
        --danger-soft: #432724;
        --debt: #ff938a;
        --debt-soft: #432724;
        --clear: #7bd39a;
        --clear-soft: #253b2d;
        --whatsapp: #82d99e;
        --whatsapp-hover: #a1e9b6;
        --whatsapp-soft: #253b2d;
        --shadow: 0 8px 26px rgb(0 0 0 / 18%);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app-shell { max-width: 1120px; margin: 0 auto; padding: 24px 18px 48px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 25px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 23px;
    }
    .brand h1 { margin: 0; font-size: clamp(20px, 4vw, 25px); letter-spacing: -.04em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    .date-pill {
      flex: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 12px;
      color: var(--muted);
      font-size: 12px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card, .panel {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .summary-card { padding: 17px 18px; }
    .summary-label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .summary-value { margin-top: 4px; font-size: clamp(21px, 5vw, 27px); font-weight: 750; letter-spacing: -.04em; }
    .summary-caption { color: var(--muted); font-size: 12px; }
    .content-grid { display: grid; grid-template-columns: minmax(265px, .85fr) minmax(0, 1.65fr); gap: 18px; align-items: start; }
    .panel { overflow: hidden; }
    .panel-header { padding: 19px 20px 14px; }
    .panel-header h2, .detail-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .panel-header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .search-wrap { padding: 0 16px 13px; }
    .search-wrap input { padding-left: 38px; }
    .search-box { position: relative; }
    .search-icon { position: absolute; top: 10px; left: 13px; color: var(--muted); pointer-events: none; }
    input {
      width: 100%;
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    input::placeholder { color: var(--muted); opacity: .8; }
    .client-list { max-height: 390px; overflow-y: auto; border-top: 1px solid var(--border); }
    .client-row {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 17px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: inherit;
      text-align: left;
    }
    .client-row:last-child { border-bottom: 0; }
    .client-row:hover { background: var(--surface-soft); }
    .client-row[aria-current="true"][data-status="debt"] { background: var(--debt-soft); box-shadow: inset 4px 0 var(--debt); }
    .client-row[aria-current="true"][data-status="clear"] { background: var(--clear-soft); box-shadow: inset 4px 0 var(--clear); }
    .client-main { min-width: 0; }
    .client-name { overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .client-phone { color: var(--muted); font-size: 12px; }
    .client-summary { display: grid; flex: none; justify-items: end; gap: 2px; }
    .client-balance { font-size: 13px; font-weight: 700; }
    .client-row[data-status="debt"] .client-balance, .client-state.debt { color: var(--debt); }
    .client-row[data-status="clear"] .client-balance, .client-state.clear { color: var(--clear); }
    .client-state { font-size: 11px; font-weight: 700; }
    .new-client { padding: 16px; border-top: 1px solid var(--border); background: var(--surface-soft); }
    .new-client h3, .transaction-form h3 { margin: 0 0 11px; font-size: 14px; }
    .form-stack { display: grid; gap: 9px; }
    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 15px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
      transition: background .15s ease, transform .15s ease;
    }
    .button:hover { background: var(--accent-hover); }
    .button:active { transform: translateY(1px); }
    .button:focus-visible, .client-row:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
    .button-full { width: 100%; }
    .detail-panel { min-height: 500px; }
    .detail-top { padding: 20px; border-bottom: 1px solid var(--border); }
    .detail-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .balance-chip { flex: none; padding: 7px 10px; border-radius: 10px; font-size: 13px; font-weight: 750; }
    .balance-chip.debt { background: var(--debt-soft); color: var(--debt); }
    .balance-chip.clear { background: var(--clear-soft); color: var(--clear); }
    .whatsapp-action { display: grid; justify-items: start; gap: 5px; margin-top: 12px; }
    .whatsapp-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border: 1px solid var(--whatsapp);
      border-radius: 10px;
      background: var(--whatsapp);
      color: var(--surface);
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .whatsapp-button:hover { border-color: var(--whatsapp-hover); background: var(--whatsapp-hover); }
    .whatsapp-button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
    .whatsapp-button:disabled { border-color: var(--border); background: var(--surface-soft); color: var(--muted); cursor: not-allowed; }
    .whatsapp-help { max-width: 420px; color: var(--muted); font-size: 12px; }
    .transaction-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 18px; }
    .transaction-form { padding: 13px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface-soft); }
    .transaction-form.payment { background: var(--surface); }
    .transaction-form label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 11px; font-weight: 600; }
    .transaction-form input { min-height: 39px; margin-bottom: 8px; background: var(--surface); font-size: 13px; }
    .transaction-form .button { min-height: 38px; padding: 7px 10px; font-size: 13px; }
    .history { padding: 18px 20px 8px; }
    .history-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .history-title h3 { margin: 0; font-size: 15px; }
    .history-title span { color: var(--muted); font-size: 12px; }
    .history-list { margin: 0; padding: 0; list-style: none; }
    .history-item { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .history-item:last-child { border-bottom: 0; }
    .history-info { min-width: 0; }
    .history-description { font-weight: 600; overflow-wrap: anywhere; }
    .history-meta { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .history-amount { flex: none; font-weight: 700; }
    .history-amount.debt { color: var(--danger); }
    .history-amount.payment { color: var(--accent); }
    .history-delete {
      flex: none;
      min-height: 40px;
      padding: 7px 11px;
      border: 1px solid var(--danger);
      border-radius: 9px;
      background: var(--danger-soft);
      color: var(--danger);
      font-weight: 650;
    }
    .history-delete:hover { background: color-mix(in srgb, var(--danger) 14%, var(--danger-soft)); }
    dialog {
      width: min(440px, calc(100% - 32px));
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgb(12 20 15 / 58%); }
    dialog h2 { margin: 0; font-size: 19px; }
    dialog p { margin: 10px 0 20px; color: var(--muted); }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .dialog-actions button { min-height: 44px; padding: 9px 15px; border-radius: 10px; font: inherit; font-weight: 650; }
    .dialog-cancel { border: 1px solid var(--border); background: var(--surface-soft); color: var(--text); }
    .dialog-confirm { border: 1px solid var(--danger); background: var(--danger-soft); color: var(--danger); }
    .dialog-actions button:focus-visible, .history-delete:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
    .empty-state { padding: 34px 20px; color: var(--muted); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 5px; color: var(--text); }
    .empty-illustration { display: grid; width: 48px; height: 48px; place-items: center; margin: 0 auto 12px; border-radius: 16px; background: var(--accent-soft); font-size: 22px; }
    .toast { position: fixed; right: 16px; bottom: 16px; z-index: 2; max-width: calc(100% - 32px); padding: 12px 16px; border-radius: 12px; background: var(--text); color: var(--surface); box-shadow: var(--shadow); }
    .toast[hidden] { display: none; }
    .storage-warning { margin: 0 0 16px; padding: 11px 14px; border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--border)); border-radius: 11px; background: var(--danger-soft); color: var(--danger); font-size: 13px; }
    @media (min-width: 760px) {
      .app-shell { padding: 34px 24px 56px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .summary-card { padding: 20px 22px; }
    }
    @media (max-width: 700px) {
      .content-grid { grid-template-columns: 1fr; }
      .client-list { max-height: 260px; }
      .detail-panel { min-height: 0; }
    }
    @media (max-width: 430px) {
      .app-shell { padding: 18px 12px 32px; }
      .date-pill { display: none; }
      .summary { gap: 9px; }
      .summary-card { padding: 14px 13px; }
      .transaction-forms { grid-template-columns: 1fr; }
      .detail-top, .history { padding-left: 15px; padding-right: 15px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">📒</div>
        <div>
          <h1>Libreta del Fiado</h1>
          <p>Las cuentas claras en tu bodega</p>
        </div>
      </div>
      <div class="date-pill" id="today"></div>
    </header>

    <div id="storage-warning" class="storage-warning" role="alert" hidden></div>

    <section class="summary" aria-label="Resumen de la bodega">
      <article class="summary-card">
        <div class="summary-label">Total por cobrar</div>
        <div class="summary-value" id="total-balance">S/ 0.00</div>
        <div class="summary-caption">Saldo pendiente de todos tus clientes</div>
      </article>
      <article class="summary-card">
        <div class="summary-label">Clientes registrados</div>
        <div class="summary-value" id="client-count">0</div>
        <div class="summary-caption">En tu libreta</div>
      </article>
    </section>

    <main class="content-grid">
      <aside class="panel" aria-label="Clientes">
        <div class="panel-header">
          <h2>Tus clientes</h2>
          <p>Busca y selecciona una cuenta</p>
        </div>
        <div class="search-wrap">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search" type="search" placeholder="Buscar por nombre..." aria-label="Buscar clientes por nombre">
          </div>
        </div>
        <div id="client-list" class="client-list"></div>
        <form id="client-form" class="new-client">
          <h3>Agregar cliente</h3>
          <div class="form-stack">
            <input name="name" type="text" maxlength="80" placeholder="Nombre completo" aria-label="Nombre del cliente" required>
            <input name="phone" type="tel" maxlength="25" placeholder="Teléfono" aria-label="Teléfono del cliente" required>
            <button class="button button-full" type="submit">＋ Agregar cliente</button>
          </div>
        </form>
      </aside>

      <section id="detail-panel" class="panel detail-panel" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description">
    <h2 id="delete-title">¿Eliminar este movimiento?</h2>
    <p id="delete-description"></p>
    <div class="dialog-actions">
      <button id="cancel-delete" class="dialog-cancel" type="button">Cancelar</button>
      <button id="confirm-delete" class="dialog-confirm" type="button">Eliminar movimiento</button>
    </div>
  </dialog>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "libreta-del-fiado-v1";
      const today = new Date();
      const localDate = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      const money = new Intl.NumberFormat("es-PE", { style: "currency", currency: "PEN" });
      const dateFormat = new Intl.DateTimeFormat("es-PE", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
      const elements = {
        today: document.getElementById("today"),
        warning: document.getElementById("storage-warning"),
        total: document.getElementById("total-balance"),
        count: document.getElementById("client-count"),
        search: document.getElementById("search"),
        clients: document.getElementById("client-list"),
        detail: document.getElementById("detail-panel"),
        clientForm: document.getElementById("client-form"),
        toast: document.getElementById("toast"),
        deleteDialog: document.getElementById("delete-dialog"),
        deleteDescription: document.getElementById("delete-description"),
        cancelDelete: document.getElementById("cancel-delete"),
        confirmDelete: document.getElementById("confirm-delete")
      };

      let state = { clients: [] };
      let selectedId = null;
      let toastTimer;
      let pendingDelete = null;

      elements.today.textContent = new Intl.DateTimeFormat("es-PE", { dateStyle: "medium" }).format(today);

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.hidden = false;
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => { elements.toast.hidden = true; }, 3200);
      }

      function readState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (!stored) return { clients: [] };
          const parsed = JSON.parse(stored);
          if (!parsed || !Array.isArray(parsed.clients)) throw new Error("Formato de datos no válido.");
          return parsed;
        } catch (error) {
          elements.warning.hidden = false;
          elements.warning.textContent = "No se pudieron leer los datos guardados. La libreta funcionará sin cargar esa información.";
          console.error("No se pudo leer la libreta guardada:", error);
          return { clients: [] };
        }
      }

      function saveState(nextState) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
          state = nextState;
          return true;
        } catch (error) {
          showToast("No se pudieron guardar los cambios en este dispositivo.");
          console.error("No se pudo guardar la libreta:", error);
          return false;
        }
      }

      function getBalance(client) {
        return client.entries.reduce((balance, entry) => balance + (entry.type === "debt" ? entry.amount : -entry.amount), 0);
      }

      function formatMoney(centavos) {
        return money.format(centavos / 100);
      }

      function formatDate(value) {
        return dateFormat.format(new Date(`${value}T00:00:00Z`));
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      function normalizePeruvianMobile(value) {
        const compact = String(value || "").replace(/[ -]/g, "");
        if (/^9\d{8}$/.test(compact)) return `51${compact}`;
        const withCountryCode = /^(?:\+?51)(9\d{8})$/.exec(compact);
        return withCountryCode ? `51${withCountryCode[1]}` : null;
      }

      function renderWhatsAppAction(client, balance) {
        if (balance <= 0) return "";

        const phone = normalizePeruvianMobile(client.phone);
        if (!phone) {
          return `
            <div class="whatsapp-action">
              <button class="whatsapp-button" type="button" disabled aria-describedby="whatsapp-phone-help">Enviar recordatorio por WhatsApp</button>
              <span class="whatsapp-help" id="whatsapp-phone-help">El teléfono guardado no tiene un formato válido para WhatsApp. Revisa que sea un celular peruano de 9 dígitos que empieza con 9.</span>
            </div>`;
        }

        const message = `Hola ${client.name}, le saluda su bodega. Le recordamos amablemente que tiene un saldo pendiente de ${formatMoney(balance)}. ¡Gracias por su preferencia!`;
        const href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        return `
          <div class="whatsapp-action">
            <a class="whatsapp-button" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="Enviar recordatorio por WhatsApp a ${escapeHtml(client.name)}. Se abrirá en una pestaña nueva.">Enviar recordatorio por WhatsApp ↗</a>
            <span class="whatsapp-help">Se abrirá WhatsApp para que revises y envíes el mensaje.</span>
          </div>`;
      }

      function renderClients() {
        const query = elements.search.value.trim().toLocaleLowerCase("es");
        const clients = state.clients.filter(client => client.name.toLocaleLowerCase("es").includes(query));
        elements.clients.innerHTML = clients.length
          ? clients.map(client => {
            const balance = getBalance(client);
            const hasDebt = balance > 0;
            return `
            <button class="client-row" type="button" data-client-id="${escapeHtml(client.id)}" data-status="${hasDebt ? "debt" : "clear"}" aria-current="${client.id === selectedId}">
              <span class="client-main">
                <span class="client-name">${escapeHtml(client.name)}</span><br>
                <span class="client-phone">${escapeHtml(client.phone)}</span>
              </span>
              <span class="client-summary">
                <span class="client-balance">${formatMoney(balance)}</span>
                <span class="client-state ${hasDebt ? "debt" : "clear"}">${hasDebt ? "Debe" : "Al día"}</span>
              </span>
            </button>`;
          }).join("")
          : `<div class="empty-state">${query ? "No encontramos clientes con ese nombre." : "Aún no tienes clientes."}</div>`;
      }

      function renderDetail() {
        const client = state.clients.find(item => item.id === selectedId);
        if (!client) {
          elements.detail.innerHTML = `
            <div class="empty-state" style="padding-top: 90px">
              <div class="empty-illustration" aria-hidden="true">🧾</div>
              <strong>Tu libreta empieza aquí</strong>
              Agrega un cliente y selecciónalo para registrar fiados y pagos.
            </div>`;
          return;
        }

        const entries = [...client.entries].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
        const balance = getBalance(client);
        const hasDebt = balance > 0;
        const history = entries.length
          ? `<ul class="history-list">${entries.map(entry => {
            const isDebt = entry.type === "debt";
            return `
              <li class="history-item">
                <div class="history-info">
                  <div class="history-description">${escapeHtml(entry.description)}</div>
                  <div class="history-meta">${isDebt ? "Fiado" : "Pago"} · ${formatDate(entry.date)}</div>
                </div>
                <div class="history-amount ${isDebt ? "debt" : "payment"}">${isDebt ? "+" : "−"} ${formatMoney(entry.amount)}</div>
                <button class="history-delete" type="button" data-entry-id="${escapeHtml(entry.id)}" aria-label="Eliminar ${isDebt ? "fiado" : "pago"}: ${escapeHtml(entry.description)}, ${formatMoney(entry.amount)}">Eliminar</button>
              </li>`;
          }).join("")}</ul>`
          : `<div class="empty-state">Todavía no hay movimientos para este cliente.</div>`;

        elements.detail.innerHTML = `
          <div class="detail-top">
            <div class="detail-heading">
              <div>
                <h2>${escapeHtml(client.name)}</h2>
                <p>${escapeHtml(client.phone)}</p>
              </div>
              <div class="balance-chip ${hasDebt ? "debt" : "clear"}" role="status" aria-label="${hasDebt ? `Saldo pendiente ${formatMoney(balance)}` : "Al día, saldo S/ 0.00"}">${hasDebt ? `${formatMoney(balance)} pendiente` : "Al día"}</div>
            </div>
            ${renderWhatsAppAction(client, balance)}
            <div class="transaction-forms">
              <form class="transaction-form" data-type="debt">
                <h3>＋ Registrar fiado</h3>
                <label>Monto (S/)</label>
                <input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required aria-label="Monto del fiado en soles">
                <label>Descripción</label>
                <input name="description" type="text" maxlength="120" placeholder="¿Qué se llevó?" required aria-label="Descripción del fiado">
                <label>Fecha</label>
                <input name="date" type="date" value="${localDate}" required aria-label="Fecha del fiado">
                <button class="button button-full" type="submit">Guardar fiado</button>
              </form>
              <form class="transaction-form payment" data-type="payment">
                <h3>↓ Registrar pago</h3>
                <label>Monto (S/)</label>
                <input name="amount" type="number" min="0.01" step="0.01" max="${(getBalance(client) / 100).toFixed(2)}" inputmode="decimal" placeholder="0.00" required aria-label="Monto del pago en soles">
                <label>Descripción</label>
                <input name="description" type="text" maxlength="120" value="Pago recibido" required aria-label="Descripción del pago">
                <label>Fecha</label>
                <input name="date" type="date" value="${localDate}" required aria-label="Fecha del pago">
                <button class="button button-full" type="submit">Guardar pago</button>
              </form>
            </div>
          </div>
          <div class="history">
            <div class="history-title"><h3>Historial</h3><span>${entries.length} ${entries.length === 1 ? "movimiento" : "movimientos"}</span></div>
            ${history}
          </div>`;
      }

      function render() {
        elements.total.textContent = formatMoney(state.clients.reduce((sum, client) => sum + getBalance(client), 0));
        elements.count.textContent = String(state.clients.length);
        renderClients();
        renderDetail();
      }

      function parseAmount(value) {
        const normalized = value.trim().replace(",", ".");
        if (!/^\d+(?:\.\d{1,2})?$/.test(normalized)) return null;
        const amount = Number(normalized);
        if (!Number.isFinite(amount) || amount <= 0) return null;
        const centavos = Math.round(amount * 100);
        return centavos > 0 ? centavos : null;
      }

      function addEntry(clientId, type, form) {
        const data = new FormData(form);
        const amount = parseAmount(String(data.get("amount") || ""));
        const description = String(data.get("description") || "").trim();
        const date = String(data.get("date") || "");
        if (!amount) {
          showToast("Ingresa un monto mayor que cero, con hasta dos decimales.");
          return;
        }
        if (!description || !date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
          showToast("Completa la descripción y una fecha válida.");
          return;
        }
        const client = state.clients.find(item => item.id === clientId);
        if (!client) return;
        if (type === "payment" && amount > getBalance(client)) {
          showToast("El pago no puede superar el saldo pendiente.");
          return;
        }
        const nextState = {
          ...state,
          clients: state.clients.map(item => item.id === clientId
            ? { ...item, entries: [...item.entries, { id: crypto.randomUUID(), type, amount, description, date, createdAt: Date.now() }] }
            : item)
        };
        if (saveState(nextState)) {
          render();
          showToast(type === "debt" ? "Fiado registrado." : "Pago registrado.");
        }
      }

      function requestDeleteEntry(clientId, entryId) {
        const client = state.clients.find(item => item.id === clientId);
        const entry = client?.entries.find(item => item.id === entryId);
        if (!client || !entry) return;

        const movementType = entry.type === "debt" ? "fiado" : "pago";
        elements.deleteDescription.textContent =
          `¿Deseas eliminar el ${movementType} «${entry.description}» de ${formatMoney(entry.amount)} del ${formatDate(entry.date)} para ${client.name}? Esta acción no se puede deshacer.`;
        pendingDelete = { clientId, entryId };
        elements.deleteDialog.showModal();
      }

      function deleteEntry(clientId, entryId) {
        const client = state.clients.find(item => item.id === clientId);
        if (!client || !client.entries.some(entry => entry.id === entryId)) return false;

        const entries = client.entries.filter(entry => entry.id !== entryId);
        const nextBalance = getBalance({ ...client, entries });
        if (nextBalance < 0) {
          elements.deleteDialog.close();
          showToast("No se puede borrar este fiado porque los pagos superarían el saldo restante. Corrige primero los pagos.");
          return false;
        }

        const nextState = {
          ...state,
          clients: state.clients.map(item => item.id === clientId ? { ...item, entries } : item)
        };
        if (!saveState(nextState)) {
          elements.deleteDialog.close();
          return false;
        }

        elements.deleteDialog.close();
        render();
        elements.clients.querySelector(`[data-client-id="${CSS.escape(clientId)}"]`)?.focus();
        showToast("Movimiento eliminado.");
        return true;
      }

      elements.clientForm.addEventListener("submit", event => {
        event.preventDefault();
        const data = new FormData(elements.clientForm);
        const name = String(data.get("name") || "").trim();
        const phone = String(data.get("phone") || "").trim();
        if (!name || !phone) {
          showToast("Ingresa el nombre y teléfono del cliente.");
          return;
        }
        if (!normalizePeruvianMobile(phone)) {
          showToast("Ingresa un celular peruano válido: 9 dígitos que empiecen con 9, con o sin espacios, guiones o prefijo +51.");
          return;
        }
        const client = { id: crypto.randomUUID(), name, phone, entries: [] };
        const nextState = { ...state, clients: [...state.clients, client] };
        if (saveState(nextState)) {
          selectedId = client.id;
          elements.clientForm.reset();
          render();
          showToast("Cliente agregado.");
        }
      });

      elements.search.addEventListener("input", renderClients);
      elements.clients.addEventListener("click", event => {
        const button = event.target.closest("[data-client-id]");
        if (!button) return;
        selectedId = button.dataset.clientId;
        render();
      });
      elements.detail.addEventListener("click", event => {
        const button = event.target.closest("[data-entry-id]");
        if (!button) return;
        requestDeleteEntry(selectedId, button.dataset.entryId);
      });
      elements.detail.addEventListener("submit", event => {
        const form = event.target.closest("form[data-type]");
        if (!form) return;
        event.preventDefault();
        addEntry(selectedId, form.dataset.type, form);
      });
      elements.cancelDelete.addEventListener("click", () => elements.deleteDialog.close());
      elements.confirmDelete.addEventListener("click", () => {
        if (!pendingDelete) return;
        deleteEntry(pendingDelete.clientId, pendingDelete.entryId);
      });
      elements.deleteDialog.addEventListener("close", () => { pendingDelete = null; });

      state = readState();
      render();
    })();
  </script>
</body>
</html>
